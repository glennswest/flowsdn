# This is a reviewed host-resource contract, not a production CNI installer.
# `image: flowsdn` is the node's flowsdn golden under the stormcos stormpump
# runtime (/pallets/flowsdn); nothing is pulled. The BPF object is embedded in
# the agent. Select exactly one validation node first.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flowsdn-agent-validation
  namespace: flowsdn-system
spec:
  selector:
    matchLabels:
      app: flowsdn-agent-validation
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app: flowsdn-agent-validation
    spec:
      serviceAccountName: flowsdn-agent
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        flowsdn.io/validation-node: "a"
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: flowsdn
          command: ["/flowsdn-agent"]
          args: ["--config", "/etc/flowsdn/agent.json"]
          securityContext:
            runAsUser: 0
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/flowsdn
              readOnly: true
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            - name: runtime
              mountPath: /var/run/flowsdn
            - name: state
              mountPath: /var/lib/flowsdn
      volumes:
        - name: config
          configMap:
            name: flowsdn-agent-example-a
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: runtime
          hostPath:
            path: /var/run/flowsdn
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/lib/flowsdn
            type: DirectoryOrCreate
