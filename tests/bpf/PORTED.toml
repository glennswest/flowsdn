# flowsdn — disposition of each harvested BPF test case.
#
# Hand-maintained. Keyed on (file, name) from tests/bpf/CASES.toml; every key
# MUST resolve there (enforced by the consistency test, spec 18 §9.4). A case
# with no [[port]] entry counts as UNPORTED in the coverage number, so this
# file only needs entries for cases that are ported or that have a
# non-default disposition.
#
# status       ported | deferred | retargeted | replaced | dropped
# tier         progrun | netns | direct | tier0     (spec 18 §10.3)
# rust         the Rust test path, required when status = "ported"
# disposition  prose, required for retargeted | replaced | dropped
#
# Seeded 2026-09-07 with the dispositions decided in spec 18 §3.10. Entries
# are added as cases are ported.

[[port]]
file = "bpf/tests/builtins.c"
name = "builtin_memzero"
status = "retargeted"
tier = "tier0"
disposition = """
Tests the reference C __builtin_* overrides in bpf/include/bpf/builtins.h.
Under ADR-0002 there are no C builtins; the analogue is
flowsdn_bpf::copy::{copy,zero,eq} (spec 02 §11.4). Ported as host-compiled
unit tests over the same widths plus one BPF_PROG_TEST_RUN case per width
group, alongside the existing ELF check for memcpy/memset/memcmp
relocations.
"""

