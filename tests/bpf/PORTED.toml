[[port]]
file = "bpf/tests/jhash_test.c"
name = "jhash"
status = "retargeted"
tier = "tier0"
disposition = """
Hash correctness is a pure function: a Tier-0 test with the same input
vectors, plus a BPF_PROG_TEST_RUN case asserting the BPF build produces
identical output, plus a userspace/BPF agreement check that Maglev needs and
the reference does not make.
"""

[[port]]
file = "bpf/tests/destroy_sock_socket_lb.c"
name = "sock_terminate"
status = "deferred"
tier = "netns"
disposition = """
The reference case #defines the bpf_sock_destroy kfunc to a mock and runs
the surrounding lookup inside an XDP wrapper, so upstream it does not
exercise socket termination. flowsdn ports the lookup at that fidelity and
adds a real netns test with live sockets. M3.
"""

