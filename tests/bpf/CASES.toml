# HOW IT WAS DERIVED
# ------------------
# tools/harvest-bpf-cases.py walks each bpf/tests/*.c with a small
# #ifdef/#elif/#else-aware preprocessor, so the feature set, ASSIGN_CONFIG
# set, included datapath object and PKTGEN/SETUP/CHECK section list recorded
# below are the ones the compiler actually sees for that translation unit.
# Cases contributed by a shared test header (e.g. encrypt_host.h) are
# attributed to every .c that includes it, with `defined_in` naming the
# header. `entrypoint` is resolved by following the SETUP stage to the
# entry helper it tail-calls, through up to three levels of local helper or
# macro indirection; "direct" means the CHECK stage calls the function under
# test itself (a library unit test) and "unresolved" means the harvester
