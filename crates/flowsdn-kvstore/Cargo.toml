[package]
name = "flowsdn-kvstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "flowsdn's kvstore client (spec 20 §3.1-3.5): the trait, an in-process memory backend, an etcd v3 backend over HTTP/2 with Fedora OpenSSL TLS, and SyncStore"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "time", "sync", "net", "io-util", "macros"] }
bytes = "=1.12.1"
h2 = "=0.4.21"
http = "=1.3.1"
prost = "=0.14.6"
openssl = "=0.10.81"
tokio-openssl = "=0.6.5"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "test-util", "process"] }
