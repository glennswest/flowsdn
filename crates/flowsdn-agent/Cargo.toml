[package]
name = "flowsdn-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Node/Pod discovery, pod CIDRs from the Node and direct node routes. Links
# flowsdn-k8s (kube with Fedora system OpenSSL, ADR-0016), so it builds for the
# GNU target only; the default static musl agent leaves it off.
kubernetes = ["dep:flowsdn-k8s", "dep:futures", "dep:http", "tokio/time"]

[dependencies]
tokio = { workspace = true, features = ["rt"] }
flowsdn-k8s = { path = "../flowsdn-k8s", version = "=0.14.0", optional = true }
futures = { version = "=0.3.31", optional = true }
http = { version = "=1.3.1", optional = true }
flowsdn-health = { path = "../flowsdn-health", version = "=0.14.0" }
serde_json.workspace = true
nix = { version = "=0.30.1", default-features = false, features = ["fs", "socket"] }
httparse = "=1.10.1"
uuid = { version = "=1.18.1", features = ["v4"] }
flowsdn-cni = { path = "../flowsdn-cni", version = "=0.14.0" }
flowsdn-bpf-loader = { path = "../flowsdn-bpf-loader", version = "=0.14.0", features = ["kernel"] }
flowsdn-bpf-abi = { path = "../flowsdn-bpf-abi", version = "=0.14.0" }
flowsdn-ipam = { path = "../flowsdn-ipam", version = "=0.14.0" }
flowsdn-lb = { path = "../flowsdn-lb", version = "=0.14.0" }
flowsdn-connector = { path = "../flowsdn-connector", version = "=0.14.0" }

[dev-dependencies]
sha2 = "=0.10.9"
openssl = "=0.10.81"
