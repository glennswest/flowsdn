# Top-of-rack peer settings: MD5 auth, fast timers, graceful restart, and dual-stack unicast families selecting advertisements labelled advertise=bgp.
apiVersion: flowsdn.io/v1alpha1
kind: FlowsdnBGPPeerConfig
metadata:
  name: tor-peer
spec:
  authSecretRef: tor-bgp-password
  ebgpMultihop: 1
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 120
  transport:
    peerPort: 179
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
