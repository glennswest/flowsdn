# Provides dual-stack LoadBalancer addresses to Services labelled for the public ingress tier.
apiVersion: flowsdn.io/v1alpha1
kind: FlowsdnLoadBalancerIPPool
metadata:
  name: public-ingress
spec:
  blocks:
    - cidr: 192.0.2.0/24
    - cidr: 2001:db8:100::/64
    - start: 198.51.100.10
      stop: 198.51.100.50
  allowFirstLastIPs: "No"
  disabled: false
  serviceSelector:
    matchLabels:
      tier: public-ingress
    matchExpressions:
      - key: io.kubernetes.service.namespace
        operator: NotIn
        values:
          - kube-system
