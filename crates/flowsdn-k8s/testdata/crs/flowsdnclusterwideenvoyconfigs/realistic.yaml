# Redirects HTTP traffic for the shop frontend Service through an Envoy listener that routes to its backend cluster.
apiVersion: flowsdn.io/v1alpha1
kind: FlowsdnClusterwideEnvoyConfig
metadata:
  name: shop-frontend-l7
spec:
  services:
    - name: frontend
      namespace: shop
      listener: shop-frontend-listener
      ports:
        - 80
  backendServices:
    - name: frontend
      namespace: shop
      number:
        - "8080"
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  resources:
    - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
      name: shop-frontend-listener
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: shop_frontend
                route_config:
                  name: shop_frontend_route
                  virtual_hosts:
                    - name: frontend
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: shop/frontend:8080
                            timeout: 15s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: shop/frontend:8080
      connect_timeout: 5s
      type: EDS
      lb_policy: ROUND_ROBIN
      outlier_detection:
        consecutive_5xx: 5
        interval: 10s
        base_ejection_time: 30s
