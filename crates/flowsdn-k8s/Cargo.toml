[package]
name = "flowsdn-k8s"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
flowsdn-table = { path = "../flowsdn-table", version = "=0.14.0" }

kube = { version = "=4.2.0", default-features = false, features = ["client", "openssl-tls"] }
k8s-openapi = { version = "=0.28.0", features = ["v1_33"] }
http = "=1.3.1"
http-body-util = "=0.1.3"
futures = "=0.3.31"
libc.workspace = true
tokio = { workspace = true, features = ["rt", "time", "fs", "io-util"] }

[dev-dependencies]
openssl = "=0.10.81"

[lints]
workspace = true
