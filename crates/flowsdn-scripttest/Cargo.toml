[package]
name = "flowsdn-scripttest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flowsdn-table = { path = "../flowsdn-table", version = "=0.14.0" }
cap-std = "=4.0.3"
regex.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "macros", "signal"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

rustix = { version = "=1.1.4", features = ["fs", "process"] }

[lints]
workspace = true

[features]
process-fixture = []

[[bin]]
name = "scripttest-fixture"
path = "src/bin/scripttest-fixture.rs"
required-features = ["process-fixture"]
