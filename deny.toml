# Policy: docs/licensing.md and spec 22 section 3.8.8.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "CC0-1.0"]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "openssl-sys", reason = "No C dependencies; ADR-0002" },
  { name = "openssl" },
  { name = "aws-lc-sys", reason = "No C dependencies; ADR-0002" },
  { name = "libnftnl-sys", reason = "No C or GPL dependencies" },
  { name = "bindgen", reason = "No C headers; ADR-0002" },
  { name = "cc", reason = "No C compiler; ADR-0002" },
]

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
