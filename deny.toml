# Policy: docs/licensing.md and spec 22 section 3.8.8.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "CC0-1.0"]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # ADR-0016 permits Fedora system OpenSSL and its Rust bindings.
  { name = "openssl-src", reason = "Use Fedora OpenSSL, not vendored sources; ADR-0016" },
  { name = "ring", reason = "Use Fedora system OpenSSL; ADR-0016" },
  { name = "aws-lc-sys", reason = "No C dependencies; ADR-0002" },
  { name = "libnftnl-sys", reason = "No C or GPL dependencies" },
  { name = "bindgen", reason = "No C headers; ADR-0002" },
  { name = "cc", wrappers = ["openssl-sys"], reason = "Only system OpenSSL header probes; ADR-0016" },
]

[[bans.features]]
name = "openssl"
deny = ["vendored"]

[[bans.features]]
name = "openssl-sys"
deny = ["vendored"]

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
