# The agent on every node. It loads BPF, attaches TCX to host veths, attaches
# its socket-lb programs to the host cgroup v2 root and adds host routes, so it
# runs privileged on the host network (a validation baseline, not a measured
# minimum-capability profile).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flowsdn
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flowsdn.labels" . | nindent 4 }}
    app.kubernetes.io/name: flowsdn-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flowsdn-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    {{- toYaml .Values.agent.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowsdn-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: flowsdn
        {{- with .Values.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        flowsdn.io/config-sha256: {{ include "flowsdn.config" . | sha256sum }}
        {{- with .Values.agent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: {{ .Values.agent.priorityClassName }}
      terminationGracePeriodSeconds: 5
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.cni.install }}
      initContainers:
        - name: install-cni
          image: {{ include "flowsdn.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/flowsdn-cni", "install"]
          env:
            - { name: HOST_PREFIX, value: /host }
            - { name: OVERWRITE_LOOPBACK, value: {{ .Values.cni.overwriteLoopback | toString | quote }} }
          volumeMounts:
            - { name: cni-path, mountPath: /host/opt/cni/bin }
            - { name: etc-cni-netd, mountPath: /host/etc/cni/net.d }
      {{- end }}
      containers:
        - name: flowsdn-agent
          image: {{ include "flowsdn.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/flowsdn-agent", "--config", "/etc/flowsdn/agent.json"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef: { apiVersion: v1, fieldPath: spec.nodeName }
          securityContext:
            privileged: true
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /etc/flowsdn, readOnly: true }
            - { name: run, mountPath: /var/run/flowsdn }
            - { name: state, mountPath: /var/lib/flowsdn }
            - { name: cgroup, mountPath: /run/flowsdn/cgroupv2 }
            {{- if .Values.agent.bpfPinRoot }}
            - { name: bpffs, mountPath: /sys/fs/bpf, mountPropagation: Bidirectional }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: flowsdn-config }
        - name: run
          hostPath: { path: /var/run/flowsdn, type: DirectoryOrCreate }
        - name: state
          hostPath: { path: /var/lib/flowsdn, type: DirectoryOrCreate }
        - name: cgroup
          hostPath: { path: /sys/fs/cgroup, type: Directory }
        - name: cni-path
          hostPath: { path: {{ .Values.cni.binPath }}, type: DirectoryOrCreate }
        - name: etc-cni-netd
          hostPath: { path: {{ .Values.cni.confPath }}, type: DirectoryOrCreate }
        {{- if .Values.agent.bpfPinRoot }}
        - name: bpffs
          hostPath: { path: /sys/fs/bpf, type: Directory }
        {{- end }}
