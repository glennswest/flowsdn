apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flowsdn.labels" . | nindent 4 }}
    app.kubernetes.io/name: flowsdn-agent
---
# Node/Pod discovery, direct routes and the ClusterIP socket LB (read-only);
# Events and the Pods' flowsdn.io/pod-networks annotation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flowsdn
  labels:
    {{- include "flowsdn.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, services]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  # Events on Pods (endpoint created/failed, IP allocation) and on this node
  # (pod CIDR, direct routes, socket LB, sysctls), #298.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, update]
  # The flowsdn.io/pod-networks annotation on this node's Pods, #328.
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch]
---
# The agent's flowsdn.io access (spec 13 §4.7); see docs/crds.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flowsdn-crds
  labels:
    {{- include "flowsdn.labels" . | nindent 4 }}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [flowsdn.io]
    resources:
      - flowsdnloadbalancerippools
      - flowsdnbgpnodeconfigs
      - flowsdnbgpadvertisements
      - flowsdnbgppeerconfigs
      - flowsdnclusterwideenvoyconfigs
      - flowsdnclusterwidenetworkpolicies
      - flowsdnegressgatewaypolicies
      - flowsdnendpoints
      - flowsdnendpointslices
      - flowsdnenvoyconfigs
      - flowsdnidentities
      - flowsdnlocalredirectpolicies
      - flowsdnnetworkpolicies
      - flowsdnnodes
      - flowsdnnodeconfigs
      - flowsdncidrgroups
      - flowsdnl2announcementpolicies
      - flowsdnpodippools
      - flowsdndatapathplugins
    verbs: [list, watch]
  - apiGroups: [flowsdn.io]
    resources: [flowsdnidentities, flowsdnendpoints, flowsdnnodes]
    verbs: [create]
  - apiGroups: [flowsdn.io]
    resources: [flowsdnidentities]
    verbs: [update]
  - apiGroups: [flowsdn.io]
    resources: [flowsdnendpoints]
    verbs: [delete, get]
  - apiGroups: [flowsdn.io]
    resources: [flowsdnnodes, flowsdnnodes/status]
    verbs: [get, update]
  - apiGroups: [flowsdn.io]
    resources: [flowsdnendpoints, flowsdnl2announcementpolicies/status, flowsdnbgpnodeconfigs/status]
    verbs: [patch]
{{- range $role := list "flowsdn" "flowsdn-crds" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $role }}
  labels:
    {{- include "flowsdn.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount.name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
