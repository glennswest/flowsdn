[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
exclude = ["crates/flowsdn-bpf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/glennswest/flowsdn"
publish = false

[workspace.dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["sync"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unwrap_used = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
