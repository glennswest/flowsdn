[workspace]
resolver = "2"
members = ["crates/*", "xtask", "tools/harvest-bpf-cases"]
exclude = ["crates/flowsdn-bpf"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/glennswest/flowsdn"
publish = false

[workspace.dependencies]
libc = "=0.2.189"
serde_json = "=1.0.151"
yaml-rust2 = { version = "=0.11.0", default-features = false }
regex = "=1.13.1"
toml = "=1.1.5"
arc-swap = "=1.9.2"
imbl = { version = "=7.0.1", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["sync"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unwrap_used = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
